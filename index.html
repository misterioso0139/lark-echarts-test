<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ECharts 儀錶板插件</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  body { display: flex; }

  #chart { flex: 1; min-width: 0; min-height: 0; }

  #panel {
    flex: none; width: 260px;
    border-left: 1px solid rgba(128,128,128,.25);
    padding: 16px; display: none; flex-direction: column;
    gap: 14px; overflow: auto; font-size: 13px;
  }
  #panel.show { display: flex; }
  #panel label { display: block; margin-bottom: 5px; color: #666; }
  #panel select {
    width: 100%; padding: 7px 8px; font-size: 13px;
    border: 1px solid rgba(128,128,128,.4); border-radius: 5px;
    background: transparent; color: inherit;
  }
  #save {
    margin-top: auto; padding: 9px; border: none; border-radius: 5px;
    background: #3370ff; color: #fff; font-size: 14px; cursor: pointer;
  }
  #save:disabled { opacity: .45; cursor: default; }

  #msg {
    position: fixed; left: 10px; bottom: 8px; right: 10px;
    font-size: 11px; line-height: 1.5; color: #b42318;
    white-space: pre-wrap; word-break: break-all;
    max-height: 40%; overflow: auto;
  }
</style>
</head>
<body>

<div id="chart"></div>

<div id="panel">
  <div>
    <label for="tableSel">資料表</label>
    <select id="tableSel"></select>
  </div>
  <div>
    <label for="groupSel">依什麼分組</label>
    <select id="groupSel"></select>
  </div>
  <button id="save" disabled>儲存並套用</button>
</div>

<div id="msg"></div>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>

<script type="module">
import { bitable, dashboard, DashboardState }
  from 'https://cdn.jsdelivr.net/npm/@lark-base-open/js-sdk@1.0.2/+esm';

const chart    = echarts.init(document.getElementById('chart'));
const panel    = document.getElementById('panel');
const tableSel = document.getElementById('tableSel');
const groupSel = document.getElementById('groupSel');
const saveBtn  = document.getElementById('save');
const msg      = document.getElementById('msg');

new ResizeObserver(() => chart.resize()).observe(document.body);

const say = (t) => { msg.textContent += (msg.textContent ? '\n' : '') + t; };
window.addEventListener('error', e => say('錯誤：' + e.message));
window.addEventListener('unhandledrejection',
  e => say('未處理：' + (e.reason?.message || e.reason)));

// ---------- 把各種格式的儲存格值，統一轉成一段可讀文字 ----------
function toText(v) {
  if (v === null || v === undefined || v === '') return '(空白)';
  if (typeof v === 'string' || typeof v === 'number') return String(v);
  if (Array.isArray(v)) {
    const parts = v.map(x =>
      typeof x === 'string' ? x : (x?.text ?? x?.name ?? '')
    ).filter(Boolean);
    return parts.length ? parts.join(', ') : '(空白)';
  }
  if (typeof v === 'object') return v.text ?? v.name ?? '(空白)';
  return String(v);
}

// ---------- 自己把整欄讀出來，自己統計筆數 ----------
async function countByField(tableId, fieldId) {
  const table = await bitable.base.getTableById(tableId);
  const field = await table.getFieldById(fieldId);

  const tally = new Map();
  let pageToken, hasMore = true, guard = 0;

  while (hasMore && guard++ < 50) {          // 上限一萬筆，避免無限迴圈
    const res = await field.getFieldValueListByPage({ pageSize: 200, pageToken });
    for (const item of (res.fieldValues || [])) {
      const key = toText(item.value);
      tally.set(key, (tally.get(key) || 0) + 1);
    }
    hasMore   = res.hasMore;
    pageToken = res.pageToken;
  }

  // 由多到少排序，只留前 20 名，免得軸擠爆
  return [...tally.entries()].sort((a, b) => b[1] - a[1]).slice(0, 20);
}

function draw(pairs, title) {
  if (!pairs || pairs.length === 0) {
    chart.clear();
    chart.setOption({ title: { text: '沒有資料', left: 'center', top: 'middle' } });
    return;
  }
  chart.setOption({
    title: { text: title || '', left: 'center' },
    tooltip: { trigger: 'axis' },
    grid: { left: 60, right: 30, top: 56, bottom: 100 },
    xAxis: {
      type: 'category',
      data: pairs.map(p => p[0]),
      axisLabel: {
        interval: 0, rotate: 35,
        formatter: v => (v.length > 10 ? v.slice(0, 10) + '…' : v)
      }
    },
    yAxis: { type: 'value', name: '筆數' },
    series: [{ type: 'bar', data: pairs.map(p => p[1]) }]
  }, true);
}

async function render(tableId, fieldId, title) {
  if (!tableId || !fieldId) return;
  try {
    draw(await countByField(tableId, fieldId), title);
  } catch (e) { say('讀資料失敗：' + e.message); }
}

// ---------- 設定模式 ----------
async function setupConfigUI() {
  panel.classList.add('show');
  try {
    const tables = await bitable.base.getTableMetaList();
    for (const t of tables) tableSel.add(new Option(t.name, t.id));

    const saved = await dashboard.getConfig().catch(() => null);
    const c = saved?.customConfig;
    if (c?.tableId && [...tableSel.options].some(o => o.value === c.tableId)) {
      tableSel.value = c.tableId;
    }
    await loadFields(c?.fieldId);
  } catch (e) { say('初始化失敗：' + e.message); }
}

async function loadFields(preferFieldId) {
  groupSel.innerHTML = '';
  saveBtn.disabled = true;
  try {
    const table  = await bitable.base.getTableById(tableSel.value);
    const fields = await table.getFieldMetaList();
    for (const f of fields) groupSel.add(new Option(f.name, f.id));

    if (preferFieldId && [...groupSel.options].some(o => o.value === preferFieldId)) {
      groupSel.value = preferFieldId;
    }
    saveBtn.disabled = fields.length === 0;
    await render(tableSel.value, groupSel.value, '預覽');
  } catch (e) { say('讀不到欄位：' + e.message); }
}

tableSel.onchange = () => loadFields();
groupSel.onchange = () => render(tableSel.value, groupSel.value, '預覽');

saveBtn.onclick = async () => {
  saveBtn.disabled = true;
  try {
    // 關鍵：dataConditions 留空，不讓主端去驗證它。
    // 我們要的設定放在 customConfig，主端不會碰。
    await dashboard.saveConfig({
      dataConditions: [],
      customConfig: {
        tableId:   tableSel.value,
        fieldId:   groupSel.value,
        fieldName: groupSel.options[groupSel.selectedIndex]?.text || ''
      }
    });
  } catch (e) {
    say('存檔失敗：' + e.message);
    saveBtn.disabled = false;
  }
};

// ---------- 檢視模式 ----------
async function showSavedChart() {
  panel.classList.remove('show');
  try {
    const cfg = await dashboard.getConfig();
    const c   = cfg?.customConfig;
    if (!c?.tableId) { say('沒有讀到已存的設定'); return; }
    await render(c.tableId, c.fieldId, c.fieldName || '');
  } catch (e) { say('取設定失敗：' + e.message); }
  dashboard.setRendered().catch(() => {});
}

if (dashboard.state === DashboardState.Create ||
    dashboard.state === DashboardState.Config) {
  setupConfigUI();
} else {
  showSavedChart();
}

dashboard.onConfigChange(() => showSavedChart());
</script>

</body>
</html>
