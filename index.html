<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ECharts 儀錶板插件</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: transparent !important; background-image: none !important;
    font-family: "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  body { display: flex; overflow: hidden; }
  #chart { flex: 1; min-width: 0; min-height: 0; }
  #panel {
    flex: none; width: 262px;
    border-left: 1px solid rgba(128,128,128,.25);
    padding: 16px; display: none; flex-direction: column;
    gap: 11px; overflow: auto; font-size: 13px;
  }
  #panel.show { display: flex; }
  #panel label { display: block; margin-bottom: 5px; color: #666; }
  #panel select {
    width: 100%; padding: 7px 8px; font-size: 13px;
    border: 1px solid rgba(128,128,128,.4); border-radius: 5px;
    background: transparent; color: inherit;
  }
  .grp { display: block; }
  .grp.hide { display: none; }
  #save {
    margin-top: auto; padding: 9px; border: none; border-radius: 5px;
    background: #3370ff; color: #fff; font-size: 14px; cursor: pointer;
  }
  #save:disabled { opacity: .45; cursor: default; }
  #msg {
    position: absolute; left: 10px; bottom: 8px; width: 58%;
    font-size: 11px; line-height: 1.5; color: #667085;
    white-space: pre-wrap; word-break: break-all;
    max-height: 80px; overflow: auto; pointer-events: none;
  }
</style>
</head>
<body>

<div id="chart"></div>

<div id="panel">
  <div><label for="tableSel">資料表</label><select id="tableSel"></select></div>
  <div><label for="typeSel">圖表樣式</label>
    <select id="typeSel">
      <option value="bar">長條圖</option>
      <option value="forest">象形長條圖（森林）</option>
      <option value="pie">圓餅圖</option>
      <option value="scatter3d">3D 散佈圖</option>
    </select>
  </div>

  <!-- 統計型圖表用 -->
  <div class="grp" id="grp2d">
    <div><label for="groupSel">依什麼分組</label><select id="groupSel"></select></div>
    <div style="margin-top:11px"><label for="seriesSel">統計方式</label><select id="seriesSel"></select></div>
  </div>

  <!-- 3D 散佈圖用 -->
  <div class="grp hide" id="grp3d">
    <div><label for="xSel">X 軸</label><select id="xSel"></select></div>
    <div style="margin-top:11px"><label for="ySel">Y 軸</label><select id="ySel"></select></div>
    <div style="margin-top:11px"><label for="zSel">Z 軸</label><select id="zSel"></select></div>
  </div>

  <button id="save" disabled>儲存並套用</button>
</div>

<div id="msg"></div>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts-gl@2.0.9/dist/echarts-gl.min.js"></script>

<script type="module">
import { bitable, dashboard, DashboardState, FieldType }
  from 'https://cdn.jsdelivr.net/npm/@lark-base-open/js-sdk@1.0.2/+esm';

const $ = id => document.getElementById(id);
const chartEl = $('chart'), chart = echarts.init(chartEl);
const panel = $('panel'), tableSel = $('tableSel'), typeSel = $('typeSel');
const groupSel = $('groupSel'), seriesSel = $('seriesSel');
const xSel = $('xSel'), ySel = $('ySel'), zSel = $('zSel');
const grp2d = $('grp2d'), grp3d = $('grp3d');
const saveBtn = $('save'), msg = $('msg');

const lines = [];
const say = t => { lines.push(t); if (lines.length > 4) lines.shift();
                   msg.textContent = lines.join('\n'); };
const noise = m => /ResizeObserver/.test(m || '');
window.addEventListener('error', e => { if (!noise(e.message)) say('錯誤：' + e.message); });
window.addEventListener('unhandledrejection', e => {
  const m = e.reason?.message || String(e.reason);
  if (!noise(m)) say('未處理：' + m);
});

let raf = 0;
new ResizeObserver(() => { cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => chart.resize()); }).observe(chartEl);

const is3D = () => typeSel.value === 'scatter3d';

// ================= 繪圖 =================
const TREE = 'path://M0,-32 L11,-11 L5,-11 L14,4 L4,4 L4,13 L-4,13 L-4,4 '
           + 'L-14,4 L-5,-11 L-11,-11 Z';

function drawBar(pairs, title) {
  chart.setOption({
    title: { text: title, left: 'center' },
    tooltip: { trigger: 'axis' },
    grid: { left: 60, right: 30, top: 56, bottom: 100 },
    xAxis: { type: 'category', data: pairs.map(p => p[0]),
      axisLabel: { interval: 0, rotate: 35,
        formatter: v => (v.length > 10 ? v.slice(0, 10) + '…' : v) } },
    yAxis: { type: 'value' },
    series: [{ type: 'bar', data: pairs.map(p => p[1]) }]
  }, true);
}

function drawForest(pairs, title) {
  chart.setOption({
    title: { text: title, left: 'center' },
    tooltip: { trigger: 'axis' },
    grid: { left: 30, right: 30, top: 70, bottom: 90 },
    xAxis: { type: 'category', data: pairs.map(p => p[0]),
      axisTick: { show: false },
      axisLine: { lineStyle: { color: 'rgba(128,128,128,.4)' } },
      axisLabel: { interval: 0, rotate: 30, margin: 12,
        formatter: v => (v.length > 8 ? v.slice(0, 8) + '…' : v) } },
    yAxis: { splitLine: { show: false }, axisTick: { show: false },
      axisLine: { show: false }, axisLabel: { show: false } },
    series: [{
      type: 'pictorialBar', symbol: TREE, symbolRepeat: true,
      symbolSize: [26, 26], symbolMargin: '12%', symbolClip: true,
      itemStyle: { color: '#2e9e5b' },
      label: { show: true, position: 'top', distance: 10,
               fontSize: 13, fontWeight: 'bold' },
      data: pairs.map(p => p[1])
    }]
  }, true);
}

function drawPie(pairs, title) {
  chart.setOption({
    title: { text: title, left: 'center' },
    tooltip: { trigger: 'item', formatter: '{b}: {c} ({d}%)' },
    series: [{
      type: 'pie', radius: ['38%', '68%'], center: ['50%', '55%'],
      data: pairs.map(p => ({ name: p[0], value: p[1] })),
      label: { formatter: '{b}\n{c}' }
    }]
  }, true);
}

// rows = [[x, y, z], ...]，names 是三個軸的欄位名稱
function drawScatter3D(rows, names) {
  const zs = rows.map(r => r[2]);
  chart.setOption({
    tooltip: {
      formatter: p => `${names[0]}: ${p.value[0]}<br>${names[1]}: ${p.value[1]}`
                    + `<br>${names[2]}: ${p.value[2]}`
    },
    visualMap: {
      show: true, dimension: 2, left: 10, bottom: 20,
      min: Math.min(...zs), max: Math.max(...zs),
      calculable: true, precision: 1,
      inRange: { color: ['#3370ff', '#2ec7c9', '#f5c542', '#ff6b6b'] }
    },
    xAxis3D: { type: 'value', name: names[0] },
    yAxis3D: { type: 'value', name: names[1] },
    zAxis3D: { type: 'value', name: names[2] },
    grid3D: {
      viewControl: { autoRotate: true, autoRotateSpeed: 8 },
      axisLine: { lineStyle: { color: 'rgba(128,128,128,.6)' } },
      axisPointer: { lineStyle: { color: 'rgba(128,128,128,.6)' } }
    },
    series: [{
      type: 'scatter3D', symbolSize: 12, data: rows,
      itemStyle: { opacity: 0.85, borderWidth: 1,
                   borderColor: 'rgba(255,255,255,.5)' }
    }]
  }, true);
}

const CHARTS_2D = { bar: drawBar, forest: drawForest, pie: drawPie };

// ================= 讀資料 =================
function toText(v) {
  if (v === null || v === undefined || v === '') return '(空白)';
  if (typeof v === 'string' || typeof v === 'number') return String(v);
  if (Array.isArray(v)) {
    const p = v.map(x => typeof x === 'string' ? x : (x?.text ?? x?.name ?? '')).filter(Boolean);
    return p.length ? p.join(', ') : '(空白)';
  }
  if (typeof v === 'object') return v.text ?? v.name ?? '(空白)';
  return String(v);
}
function toNum(v) {
  if (typeof v === 'number') return v;
  if (typeof v === 'string') { const n = Number(v); return isNaN(n) ? null : n; }
  if (Array.isArray(v)) { const n = Number(v[0]?.text); return isNaN(n) ? null : n; }
  if (v && typeof v === 'object') { const n = Number(v.value ?? v.text); return isNaN(n) ? null : n; }
  return null;
}

async function readField(tableId, fieldId) {
  const table = await bitable.base.getTableById(tableId);
  const field = await table.getFieldById(fieldId);
  const out = new Map();
  let pageToken, hasMore = true, guard = 0;
  while (hasMore && guard++ < 50) {
    const res = await field.getFieldValueListByPage({ pageSize: 200, pageToken });
    for (const it of (res.fieldValues || [])) out.set(it.recordId, it.value);
    hasMore = res.hasMore; pageToken = res.pageToken;
  }
  return out;
}

// 統計型：分組後彙總
async function aggregate(tableId, groupFieldId, seriesKey) {
  const groups = await readField(tableId, groupFieldId);
  if (seriesKey === 'COUNTA') {
    const tally = new Map();
    for (const v of groups.values()) {
      const k = toText(v);
      tally.set(k, (tally.get(k) || 0) + 1);
    }
    return [...tally.entries()].sort((a, b) => b[1] - a[1]).slice(0, 20);
  }
  const [valueFieldId, rollup] = seriesKey.split('|');
  const values = await readField(tableId, valueFieldId);
  const buckets = new Map();
  for (const [recId, gv] of groups) {
    const k = toText(gv);
    if (!buckets.has(k)) buckets.set(k, []);
    buckets.get(k).push(toNum(values.get(recId)) ?? 0);
  }
  const out = [];
  for (const [k, nums] of buckets) {
    let r;
    if (rollup === 'SUM')          r = nums.reduce((a, b) => a + b, 0);
    else if (rollup === 'AVERAGE') r = nums.reduce((a, b) => a + b, 0) / (nums.length || 1);
    else if (rollup === 'MAX')     r = Math.max(...nums);
    else                           r = Math.min(...nums);
    out.push([k, Math.round(r * 100) / 100]);
  }
  return out.sort((a, b) => b[1] - a[1]).slice(0, 20);
}

// 散佈型：不統計，一筆記錄一個點
async function rawRows(tableId, fieldIds) {
  const maps = [];
  for (const fid of fieldIds) maps.push(await readField(tableId, fid));
  const rows = [];
  for (const recId of maps[0].keys()) {
    const point = maps.map(m => toNum(m.get(recId)));
    if (point.every(n => n !== null)) rows.push(point);   // 有空值就跳過
  }
  return rows;
}

// ================= 設定 =================
const customConfig = () => ({
  tableId: tableSel.value,
  chartType: typeSel.value,
  fieldId: groupSel.value,
  seriesKey: seriesSel.value,
  fieldName: groupSel.options[groupSel.selectedIndex]?.text || '',
  xId: xSel.value, yId: ySel.value, zId: zSel.value,
  xName: xSel.options[xSel.selectedIndex]?.text || '',
  yName: ySel.options[ySel.selectedIndex]?.text || '',
  zName: zSel.options[zSel.selectedIndex]?.text || ''
});

function syncPanel() {
  grp2d.classList.toggle('hide', is3D());
  grp3d.classList.toggle('hide', !is3D());
}

async function setupConfigUI() {
  panel.classList.add('show');
  const tables = await bitable.base.getTableMetaList();
  for (const t of tables) tableSel.add(new Option(t.name, t.id));

  let c = null;
  if (dashboard.state !== DashboardState.Create) {
    c = (await dashboard.getConfig().catch(() => null))?.customConfig;
  }
  if (c?.tableId && [...tableSel.options].some(o => o.value === c.tableId)) {
    tableSel.value = c.tableId;
  }
  if (c?.chartType) typeSel.value = c.chartType;
  syncPanel();
  await loadFields(c);
}

async function loadFields(c) {
  saveBtn.disabled = true;
  for (const s of [groupSel, seriesSel, xSel, ySel, zSel]) s.innerHTML = '';

  const table  = await bitable.base.getTableById(tableSel.value);
  const fields = await table.getFieldMetaList();
  const nums   = fields.filter(f => f.type === FieldType.Number);

  for (const f of fields) groupSel.add(new Option(f.name, f.id));
  if (c?.fieldId && [...groupSel.options].some(o => o.value === c.fieldId)) {
    groupSel.value = c.fieldId;
  }

  seriesSel.add(new Option('記錄筆數', 'COUNTA'));
  for (const f of nums) {
    for (const r of ['SUM', 'AVERAGE', 'MAX', 'MIN']) {
      const zh = { SUM: '總和', AVERAGE: '平均', MAX: '最大', MIN: '最小' }[r];
      seriesSel.add(new Option(`${f.name} — ${zh}`, `${f.id}|${r}`));
    }
  }
  if (c?.seriesKey && [...seriesSel.options].some(o => o.value === c.seriesKey)) {
    seriesSel.value = c.seriesKey;
  }

  // 3D 三個軸都只能選數字欄位
  for (const sel of [xSel, ySel, zSel]) {
    for (const f of nums) sel.add(new Option(f.name, f.id));
  }
  if (nums.length >= 3) {
    xSel.selectedIndex = 0; ySel.selectedIndex = 1; zSel.selectedIndex = 2;
  }
  if (c?.xId && [...xSel.options].some(o => o.value === c.xId)) {
    xSel.value = c.xId; ySel.value = c.yId; zSel.value = c.zId;
  }

  saveBtn.disabled = fields.length === 0;
  await render('預覽');
}

async function render(title) {
  if (!tableSel.value) return;
  try {
    if (is3D()) {
      if (![xSel.value, ySel.value, zSel.value].every(Boolean)) {
        chart.clear();
        chart.setOption({ title: {
          text: '3D 散佈圖需要三個數字欄位', left: 'center', top: 'middle' } });
        return;
      }
      const rows = await rawRows(tableSel.value, [xSel.value, ySel.value, zSel.value]);
      drawScatter3D(rows, [
        xSel.options[xSel.selectedIndex].text,
        ySel.options[ySel.selectedIndex].text,
        zSel.options[zSel.selectedIndex].text
      ]);
      say(`3D：${rows.length} 個點`);
    } else {
      if (!groupSel.value) return;
      const pairs = await aggregate(tableSel.value, groupSel.value, seriesSel.value);
      if (!pairs.length) {
        chart.clear();
        chart.setOption({ title: { text: '沒有資料', left: 'center', top: 'middle' } });
        return;
      }
      (CHARTS_2D[typeSel.value] || drawBar)(pairs, title || '');
    }
  } catch (e) { say('繪製失敗：' + e.message); }
}

tableSel.onchange  = () => loadFields(null).catch(e => say(e.message));
typeSel.onchange   = () => { syncPanel(); render('預覽'); };
groupSel.onchange  = () => render('預覽');
seriesSel.onchange = () => render('預覽');
xSel.onchange = ySel.onchange = zSel.onchange = () => render('預覽');

saveBtn.onclick = async () => {
  saveBtn.disabled = true;
  try {
    await dashboard.saveConfig({ dataConditions: [], customConfig: customConfig() });
  } catch (e) { say('存檔失敗：' + e.message); saveBtn.disabled = false; }
};

// ================= 展示 =================
async function showChart() {
  panel.classList.remove('show');
  const c = (await dashboard.getConfig().catch(() => null))?.customConfig;
  if (!c?.tableId) { say('沒有讀到設定'); return; }
  typeSel.value = c.chartType || 'bar';
  try {
    if (c.chartType === 'scatter3d') {
      const rows = await rawRows(c.tableId, [c.xId, c.yId, c.zId]);
      drawScatter3D(rows, [c.xName, c.yName, c.zName]);
    } else {
      const pairs = await aggregate(c.tableId, c.fieldId, c.seriesKey);
      (CHARTS_2D[c.chartType] || drawBar)(pairs, c.fieldName || '');
    }
  } catch (e) { say('繪製失敗：' + e.message); }
  dashboard.setRendered().catch(() => {});
}

if (dashboard.state === DashboardState.Create ||
    dashboard.state === DashboardState.Config) {
  setupConfigUI().catch(e => say('初始化失敗：' + e.message));
} else {
  showChart();
}

dashboard.onConfigChange(() => showChart());
</script>

</body>
</html>
