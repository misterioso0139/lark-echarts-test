<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ECharts 儀錶板插件</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: transparent !important; background-image: none !important;
    font-family: "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  body { display: flex; overflow: hidden; }
  #chart { flex: 1; min-width: 0; min-height: 0; }
  #panel {
    flex: none; width: 262px;
    border-left: 1px solid rgba(128,128,128,.25);
    padding: 16px; display: none; flex-direction: column;
    gap: 12px; overflow: auto; font-size: 13px;
  }
  #panel.show { display: flex; }
  #panel label { display: block; margin-bottom: 5px; color: #666; }
  #panel select {
    width: 100%; padding: 7px 8px; font-size: 13px;
    border: 1px solid rgba(128,128,128,.4); border-radius: 5px;
    background: transparent; color: inherit;
  }
  #save {
    margin-top: auto; padding: 9px; border: none; border-radius: 5px;
    background: #3370ff; color: #fff; font-size: 14px; cursor: pointer;
  }
  #save:disabled { opacity: .45; cursor: default; }
  #msg {
    position: absolute; left: 10px; bottom: 8px; width: 58%;
    font-size: 11px; line-height: 1.5; color: #667085;
    white-space: pre-wrap; word-break: break-all;
    max-height: 80px; overflow: auto; pointer-events: none;
  }
</style>
</head>
<body>

<div id="chart"></div>

<div id="panel">
  <div><label for="tableSel">資料表</label><select id="tableSel"></select></div>
  <div><label for="groupSel">依什麼分組</label><select id="groupSel"></select></div>
  <div><label for="seriesSel">統計方式</label><select id="seriesSel"></select></div>
  <div>
    <label for="typeSel">圖表樣式</label>
    <select id="typeSel">
      <option value="bar">長條圖</option>
      <option value="forest">象形長條圖（森林）</option>
    </select>
  </div>
  <button id="save" disabled>儲存並套用</button>
</div>

<div id="msg"></div>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>

<script type="module">
import { bitable, dashboard, DashboardState, FieldType }
  from 'https://cdn.jsdelivr.net/npm/@lark-base-open/js-sdk@1.0.2/+esm';

const $ = id => document.getElementById(id);
const chartEl = $('chart'), chart = echarts.init(chartEl);
const panel = $('panel'), tableSel = $('tableSel'), groupSel = $('groupSel');
const seriesSel = $('seriesSel'), typeSel = $('typeSel'), saveBtn = $('save');
const msg = $('msg');

const lines = [];
const say = t => { lines.push(t); if (lines.length > 4) lines.shift();
                   msg.textContent = lines.join('\n'); };
const noise = m => /ResizeObserver/.test(m || '');
window.addEventListener('error', e => { if (!noise(e.message)) say('錯誤：' + e.message); });
window.addEventListener('unhandledrejection', e => {
  const m = e.reason?.message || String(e.reason);
  if (!noise(m)) say('未處理：' + m);
});

let raf = 0;
new ResizeObserver(() => { cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => chart.resize()); }).observe(chartEl);

// 一棵針葉樹的輪廓
const TREE = 'path://M0,-32 L11,-11 L5,-11 L14,4 L4,4 L4,13 L-4,13 L-4,4 '
           + 'L-14,4 L-5,-11 L-11,-11 Z';

function drawBar(pairs, title) {
  chart.setOption({
    title: { text: title, left: 'center' },
    tooltip: { trigger: 'axis' },
    grid: { left: 60, right: 30, top: 56, bottom: 100 },
    xAxis: { type: 'category', data: pairs.map(p => p[0]),
      axisLabel: { interval: 0, rotate: 35,
        formatter: v => (v.length > 10 ? v.slice(0, 10) + '…' : v) } },
    yAxis: { type: 'value' },
    series: [{ type: 'bar', data: pairs.map(p => p[1]) }]
  }, true);
}

function drawForest(pairs, title) {
  chart.setOption({
    title: { text: title, left: 'center' },
    tooltip: { trigger: 'axis' },
    grid: { left: 30, right: 30, top: 70, bottom: 90 },
    xAxis: {
      type: 'category', data: pairs.map(p => p[0]),
      axisTick: { show: false },
      axisLine: { lineStyle: { color: 'rgba(128,128,128,.4)' } },
      axisLabel: { interval: 0, rotate: 30, margin: 12,
        formatter: v => (v.length > 8 ? v.slice(0, 8) + '…' : v) }
    },
    yAxis: {
      splitLine: { show: false }, axisTick: { show: false },
      axisLine: { show: false }, axisLabel: { show: false }
    },
    series: [{
      type: 'pictorialBar',
      symbol: TREE,
      symbolRepeat: true,          // 依數值重複堆疊樹的圖形
      symbolSize: [26, 26],
      symbolMargin: '12%',
      symbolClip: true,            // 超出數值的部分裁掉，末端會出現半棵樹
      itemStyle: { color: '#2e9e5b' },
      label: {
        show: true, position: 'top', distance: 10,
        fontSize: 13, fontWeight: 'bold', color: 'inherit'
      },
      data: pairs.map(p => p[1])
    }]
  }, true);
}

function draw(pairs, title) {
  if (!pairs?.length) {
    chart.clear();
    chart.setOption({ title: { text: '沒有資料', left: 'center', top: 'middle' } });
    return;
  }
  (typeSel.value === 'forest' ? drawForest : drawBar)(pairs, title || '');
}

// ---------- 讀資料、在瀏覽器裡自己統計 ----------
function toText(v) {
  if (v === null || v === undefined || v === '') return '(空白)';
  if (typeof v === 'string' || typeof v === 'number') return String(v);
  if (Array.isArray(v)) {
    const p = v.map(x => typeof x === 'string' ? x : (x?.text ?? x?.name ?? '')).filter(Boolean);
    return p.length ? p.join(', ') : '(空白)';
  }
  if (typeof v === 'object') return v.text ?? v.name ?? '(空白)';
  return String(v);
}
function toNum(v) {
  if (typeof v === 'number') return v;
  if (typeof v === 'string') return Number(v) || 0;
  if (Array.isArray(v)) return Number(v[0]?.text) || 0;
  if (v && typeof v === 'object') return Number(v.value ?? v.text) || 0;
  return 0;
}

async function readField(tableId, fieldId) {
  const table = await bitable.base.getTableById(tableId);
  const field = await table.getFieldById(fieldId);
  const out = new Map();
  let pageToken, hasMore = true, guard = 0;
  while (hasMore && guard++ < 50) {
    const res = await field.getFieldValueListByPage({ pageSize: 200, pageToken });
    for (const it of (res.fieldValues || [])) out.set(it.recordId, it.value);
    hasMore = res.hasMore; pageToken = res.pageToken;
  }
  return out;
}

async function aggregate(tableId, groupFieldId, seriesKey) {
  const groups = await readField(tableId, groupFieldId);

  if (seriesKey === 'COUNTA') {
    const tally = new Map();
    for (const v of groups.values()) {
      const k = toText(v);
      tally.set(k, (tally.get(k) || 0) + 1);
    }
    return [...tally.entries()].sort((a, b) => b[1] - a[1]).slice(0, 20);
  }

  const [valueFieldId, rollup] = seriesKey.split('|');
  const values = await readField(tableId, valueFieldId);

  const buckets = new Map();
  for (const [recId, gv] of groups) {
    const k = toText(gv);
    if (!buckets.has(k)) buckets.set(k, []);
    buckets.get(k).push(toNum(values.get(recId)));
  }

  const out = [];
  for (const [k, nums] of buckets) {
    let r;
    if (rollup === 'SUM')          r = nums.reduce((a, b) => a + b, 0);
    else if (rollup === 'AVERAGE') r = nums.reduce((a, b) => a + b, 0) / (nums.length || 1);
    else if (rollup === 'MAX')     r = Math.max(...nums);
    else                           r = Math.min(...nums);
    out.push([k, Math.round(r * 100) / 100]);
  }
  return out.sort((a, b) => b[1] - a[1]).slice(0, 20);
}

// ---------- 設定 ----------
const isConfigStage = dashboard.state === DashboardState.Create ||
                      dashboard.state === DashboardState.Config;

const customConfig = () => ({
  tableId:   tableSel.value,
  fieldId:   groupSel.value,
  seriesKey: seriesSel.value,
  chartType: typeSel.value,
  fieldName: groupSel.options[groupSel.selectedIndex]?.text || ''
});

async function setupConfigUI() {
  panel.classList.add('show');
  const tables = await bitable.base.getTableMetaList();
  for (const t of tables) tableSel.add(new Option(t.name, t.id));

  let c = null;
  if (dashboard.state !== DashboardState.Create) {
    c = (await dashboard.getConfig().catch(() => null))?.customConfig;
  }
  if (c?.tableId && [...tableSel.options].some(o => o.value === c.tableId)) {
    tableSel.value = c.tableId;
  }
  if (c?.chartType) typeSel.value = c.chartType;
  await loadFields(c);
}

async function loadFields(c) {
  saveBtn.disabled = true;
  groupSel.innerHTML = ''; seriesSel.innerHTML = '';

  const table  = await bitable.base.getTableById(tableSel.value);
  const fields = await table.getFieldMetaList();
  for (const f of fields) groupSel.add(new Option(f.name, f.id));
  if (c?.fieldId && [...groupSel.options].some(o => o.value === c.fieldId)) {
    groupSel.value = c.fieldId;
  }

  seriesSel.add(new Option('記錄筆數', 'COUNTA'));
  for (const f of fields) {
    if (f.type === FieldType.Number) {
      for (const r of ['SUM', 'AVERAGE', 'MAX', 'MIN']) {
        const zh = { SUM: '總和', AVERAGE: '平均', MAX: '最大', MIN: '最小' }[r];
        seriesSel.add(new Option(`${f.name} — ${zh}`, `${f.id}|${r}`));
      }
    }
  }
  if (c?.seriesKey && [...seriesSel.options].some(o => o.value === c.seriesKey)) {
    seriesSel.value = c.seriesKey;
  }

  saveBtn.disabled = fields.length === 0;
  await render('預覽');
}

async function render(title) {
  if (!tableSel.value || !groupSel.value) return;
  try {
    draw(await aggregate(tableSel.value, groupSel.value, seriesSel.value), title);
  } catch (e) { say('讀資料失敗：' + e.message); }
}

tableSel.onchange  = () => loadFields(null).catch(e => say(e.message));
groupSel.onchange  = () => render('預覽');
seriesSel.onchange = () => render('預覽');
typeSel.onchange   = () => render('預覽');

saveBtn.onclick = async () => {
  saveBtn.disabled = true;
  try {
    // 不寫入 dataConditions，避免主端資料計算不穩定的問題
    await dashboard.saveConfig({ dataConditions: [], customConfig: customConfig() });
  } catch (e) { say('存檔失敗：' + e.message); saveBtn.disabled = false; }
};

// ---------- 展示 ----------
async function showChart() {
  panel.classList.remove('show');
  const c = (await dashboard.getConfig().catch(() => null))?.customConfig;
  if (!c?.tableId) { say('沒有讀到設定'); return; }
  typeSel.value = c.chartType || 'bar';
  try {
    draw(await aggregate(c.tableId, c.fieldId, c.seriesKey), c.fieldName || '');
  } catch (e) { say('讀資料失敗：' + e.message); }
  dashboard.setRendered().catch(() => {});
}

if (isConfigStage) {
  setupConfigUI().catch(e => say('初始化失敗：' + e.message));
} else {
  showChart();
}

dashboard.onConfigChange(() => showChart());
</script>

</body>
</html>
