<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ECharts 儀錶板插件</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: transparent !important; background-image: none !important;
    font-family: "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  body { display: flex; overflow: hidden; }
  #chart { flex: 1; min-width: 0; min-height: 0; }
  #panel {
    flex: none; width: 262px;
    border-left: 1px solid rgba(128,128,128,.25);
    padding: 16px; display: none; flex-direction: column;
    gap: 12px; overflow: auto; font-size: 13px;
  }
  #panel.show { display: flex; }
  #panel label { display: block; margin-bottom: 5px; color: #666; }
  #panel select {
    width: 100%; padding: 7px 8px; font-size: 13px;
    border: 1px solid rgba(128,128,128,.4); border-radius: 5px;
    background: transparent; color: inherit;
  }
  #stage {
    font-size: 11px; color: #3370ff;
    background: rgba(51,112,255,.08); padding: 7px 9px; border-radius: 5px;
    line-height: 1.5;
  }
  #save {
    margin-top: auto; padding: 9px; border: none; border-radius: 5px;
    background: #3370ff; color: #fff; font-size: 14px; cursor: pointer;
  }
  #save:disabled { opacity: .45; cursor: default; }
  #msg {
    position: absolute; left: 10px; bottom: 8px; width: 58%;
    font-size: 11px; line-height: 1.5; color: #667085;
    white-space: pre-wrap; word-break: break-all;
    max-height: 90px; overflow: auto; pointer-events: none;
  }
</style>
</head>
<body>

<div id="chart"></div>

<div id="panel">
  <div id="stage"></div>
  <div><label for="tableSel">資料表</label><select id="tableSel"></select></div>
  <div><label for="rangeSel">資料範圍</label><select id="rangeSel"></select></div>
  <div><label for="groupSel">依什麼分組</label><select id="groupSel"></select></div>
  <div><label for="seriesSel">統計方式</label><select id="seriesSel"></select></div>
  <button id="save" disabled>儲存並套用</button>
</div>

<div id="msg"></div>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>

<script type="module">
import { bitable, dashboard, DashboardState, SourceType, Rollup, FieldType,
         GroupMode, ORDER, DATA_SOURCE_SORT_TYPE }
  from 'https://cdn.jsdelivr.net/npm/@lark-base-open/js-sdk@1.0.2/+esm';

const $ = id => document.getElementById(id);
const chartEl = $('chart'), chart = echarts.init(chartEl);
const panel = $('panel'), stageEl = $('stage');
const tableSel = $('tableSel'), rangeSel = $('rangeSel');
const groupSel = $('groupSel'), seriesSel = $('seriesSel');
const saveBtn = $('save'), msg = $('msg');

const lines = [];
const say = t => { lines.push(t); if (lines.length > 5) lines.shift();
                   msg.textContent = lines.join('\n'); };
const noise = m => /ResizeObserver/.test(m || '');
window.addEventListener('error', e => { if (!noise(e.message)) say('錯誤：' + e.message); });
window.addEventListener('unhandledrejection', e => {
  const m = e.reason?.message || String(e.reason);
  if (!noise(m)) say('未處理：' + m);
});

let raf = 0;
new ResizeObserver(() => { cancelAnimationFrame(raf);
  raf = requestAnimationFrame(() => chart.resize()); }).observe(chartEl);

const isCreate = dashboard.state === DashboardState.Create;
const isConfig = dashboard.state === DashboardState.Config;

// ---------- 畫圖 ----------
function drawPairs(pairs, title) {
  if (!pairs?.length) {
    chart.clear();
    chart.setOption({ title: { text: '沒有資料', left: 'center', top: 'middle' } });
    return;
  }
  chart.setOption({
    title: { text: title || '', left: 'center' },
    tooltip: { trigger: 'axis' },
    grid: { left: 60, right: 30, top: 56, bottom: 100 },
    xAxis: { type: 'category', data: pairs.map(p => p[0]),
      axisLabel: { interval: 0, rotate: 35,
        formatter: v => (v.length > 10 ? v.slice(0, 10) + '…' : v) } },
    yAxis: { type: 'value' },
    series: [{ type: 'bar', data: pairs.map(p => p[1]) }]
  }, true);
}
const fromHost = d => (Array.isArray(d) ? d.slice(1) : [])
  .map(r => [r[0]?.text ?? '(空白)', Number(r[1]?.value) || 0]);

// ---------- 備援：自己讀自己算 ----------
function toText(v) {
  if (v === null || v === undefined || v === '') return '(空白)';
  if (typeof v === 'string' || typeof v === 'number') return String(v);
  if (Array.isArray(v)) {
    const p = v.map(x => typeof x === 'string' ? x : (x?.text ?? x?.name ?? '')).filter(Boolean);
    return p.length ? p.join(', ') : '(空白)';
  }
  if (typeof v === 'object') return v.text ?? v.name ?? '(空白)';
  return String(v);
}
async function selfCount(tableId, fieldId) {
  const table = await bitable.base.getTableById(tableId);
  const field = await table.getFieldById(fieldId);
  const tally = new Map();
  let pageToken, hasMore = true, guard = 0;
  while (hasMore && guard++ < 50) {
    const res = await field.getFieldValueListByPage({ pageSize: 200, pageToken });
    for (const it of (res.fieldValues || [])) {
      const k = toText(it.value);
      tally.set(k, (tally.get(k) || 0) + 1);
    }
    hasMore = res.hasMore; pageToken = res.pageToken;
  }
  return [...tally.entries()].sort((a, b) => b[1] - a[1]).slice(0, 20);
}

// ---------- 設定內容 ----------
let ranges = [];
function buildSeries() {
  const v = seriesSel.value;
  if (v === 'COUNTA') return 'COUNTA';
  const [fieldId, rollup] = v.split('|');
  return [{ fieldId, rollup }];
}
const dataCondition = () => ({
  tableId: tableSel.value,
  dataRange: ranges[rangeSel.value] || { type: SourceType.ALL },
  series: buildSeries(),
  groups: [{
    fieldId: groupSel.value,
    mode: GroupMode.INTEGRATED,
    sort: { order: ORDER.ASCENDING, sortType: DATA_SOURCE_SORT_TYPE.VIEW }
  }]
});
const customConfig = () => ({
  tableId:   tableSel.value,
  fieldId:   groupSel.value,
  rangeIdx:  rangeSel.value,
  seriesKey: seriesSel.value,
  fieldName: groupSel.options[groupSel.selectedIndex]?.text || ''
});

// ---------- 設定 / 創建狀態 ----------
async function setupConfigUI() {
  panel.classList.add('show');
  stageEl.textContent = isCreate
    ? '創建階段：這次只會記住你的選擇。存檔後請點元件右上角的「⋮ → 重新設定」，再存一次，才會啟用主端統計。'
    : '設定階段：這次會完整寫入資料來源設定，啟用主端統計。';

  saveBtn.textContent = isCreate ? '建立圖表' : '儲存並套用';

  const tables = await bitable.base.getTableMetaList();
  for (const t of tables) tableSel.add(new Option(t.name, t.id));

  let saved = null;
  if (!isCreate) saved = await dashboard.getConfig().catch(() => null);
  const c = saved?.customConfig;
  if (c?.tableId && [...tableSel.options].some(o => o.value === c.tableId)) {
    tableSel.value = c.tableId;
  }
  await loadTableDetail(c);
}

async function loadTableDetail(c) {
  saveBtn.disabled = true;
  rangeSel.innerHTML = ''; groupSel.innerHTML = ''; seriesSel.innerHTML = '';

  ranges = await dashboard.getTableDataRange(tableSel.value);
  ranges.forEach((r, i) => rangeSel.add(new Option(
    r.type === SourceType.ALL ? '全部資料' : `視圖：${r.viewName}`, i)));
  if (c?.rangeIdx && ranges[c.rangeIdx]) rangeSel.value = c.rangeIdx;

  const cats = await dashboard.getCategories(tableSel.value);
  for (const cat of cats) groupSel.add(new Option(cat.fieldName, cat.fieldId));
  if (c?.fieldId && [...groupSel.options].some(o => o.value === c.fieldId)) {
    groupSel.value = c.fieldId;
  }

  seriesSel.add(new Option('記錄筆數 (COUNTA)', 'COUNTA'));
  for (const cat of cats) {
    if (cat.fieldType === FieldType.Number) {
      for (const r of [Rollup.SUM, Rollup.AVERAGE, Rollup.MAX, Rollup.MIN]) {
        seriesSel.add(new Option(`${cat.fieldName} — ${r}`, `${cat.fieldId}|${r}`));
      }
    }
  }
  if (c?.seriesKey && [...seriesSel.options].some(o => o.value === c.seriesKey)) {
    seriesSel.value = c.seriesKey;
  }

  saveBtn.disabled = cats.length === 0;
  await preview();
}

async function preview() {
  if (!tableSel.value || !groupSel.value) return;
  try { drawPairs(fromHost(await dashboard.getPreviewData(dataCondition())), '預覽'); }
  catch (e) {
    say('主端預覽失敗，改用自行統計');
    drawPairs(await selfCount(tableSel.value, groupSel.value), '預覽');
  }
}

tableSel.onchange  = () => loadTableDetail(null).catch(e => say(e.message));
rangeSel.onchange  = preview;
groupSel.onchange  = preview;
seriesSel.onchange = preview;

saveBtn.onclick = async () => {
  saveBtn.disabled = true;
  try {
    // 創建階段資料尚未落庫，只存 customConfig，不碰 dataConditions
    const config = isCreate
      ? { dataConditions: [], customConfig: customConfig() }
      : { dataConditions: dataCondition(), customConfig: customConfig() };
    await dashboard.saveConfig(config);
  } catch (e) { say('存檔失敗：' + e.message); saveBtn.disabled = false; }
};

// ---------- 展示狀態 ----------
async function showChart() {
  panel.classList.remove('show');
  const cfg = await dashboard.getConfig().catch(() => null);
  const c   = cfg?.customConfig || {};
  const dc  = cfg?.dataConditions;
  const hasCondition = Array.isArray(dc) ? dc.length > 0 : !!dc;

  if (hasCondition) {
    try {
      drawPairs(fromHost(await dashboard.getData()), c.fieldName || '');
      say('✓ 主端統計');
      dashboard.setRendered().catch(() => {});
      return;
    } catch (e) { say('主端取資料失敗：' + e.message); }
  }

  if (c.tableId) {
    try {
      drawPairs(await selfCount(c.tableId, c.fieldId), c.fieldName || '');
      say(hasCondition ? '✓ 自行統計（備援）'
                       : '✓ 自行統計。點「⋮ → 重新設定」再存一次可啟用主端統計。');
    } catch (e) { say('自行統計失敗：' + e.message); }
  }
  dashboard.setRendered().catch(() => {});
}

if (isCreate || isConfig) {
  setupConfigUI().catch(e => say('初始化失敗：' + e.message));
} else {
  showChart();
}

dashboard.onDataChange(({ data }) => drawPairs(fromHost(data)));
dashboard.onConfigChange(() => showChart());
</script>

</body>
</html>
