<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ECharts 儀錶板插件</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    font-family: "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  }
  body { display: flex; }

  #chart { flex: 1; min-width: 0; min-height: 0; }

  #panel {
    flex: none; width: 260px;
    border-left: 1px solid rgba(128,128,128,.25);
    padding: 16px; display: none; flex-direction: column;
    gap: 14px; overflow: auto; font-size: 13px;
  }
  #panel.show { display: flex; }
  #panel label { display: block; margin-bottom: 5px; color: #666; }
  #panel select {
    width: 100%; padding: 7px 8px; font-size: 13px;
    border: 1px solid rgba(128,128,128,.4); border-radius: 5px;
    background: transparent; color: inherit;
  }
  #save {
    margin-top: auto; padding: 9px; border: none; border-radius: 5px;
    background: #3370ff; color: #fff; font-size: 14px; cursor: pointer;
  }
  #save:disabled { opacity: .45; cursor: default; }

  #msg {
    position: fixed; left: 10px; bottom: 8px; right: 10px;
    font-size: 11px; line-height: 1.5; color: #b42318;
    white-space: pre-wrap; word-break: break-all;
    max-height: 40%; overflow: auto;
  }
</style>
</head>
<body>

<div id="chart"></div>

<div id="panel">
  <div>
    <label for="tableSel">資料表</label>
    <select id="tableSel"></select>
  </div>
  <div>
    <label for="groupSel">依什麼分組</label>
    <select id="groupSel"></select>
  </div>
  <button id="save" disabled>儲存並套用</button>
</div>

<div id="msg"></div>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.6.0/dist/echarts.min.js"></script>

<script type="module">
import { bitable, dashboard, DashboardState, SourceType }
  from 'https://cdn.jsdelivr.net/npm/@lark-base-open/js-sdk@1.0.2/+esm';

const chart    = echarts.init(document.getElementById('chart'));
const panel    = document.getElementById('panel');
const tableSel = document.getElementById('tableSel');
const groupSel = document.getElementById('groupSel');
const saveBtn  = document.getElementById('save');
const msg      = document.getElementById('msg');

new ResizeObserver(() => chart.resize()).observe(document.body);

// Lark 客戶端看不到瀏覽器 console，所以錯誤直接印在畫面上
const say = (t) => { msg.textContent += (msg.textContent ? '\n' : '') + t; };
window.addEventListener('error', e => say('錯誤：' + e.message));
window.addEventListener('unhandledrejection', e => say('未處理：' + (e.reason?.message || e.reason)));

function draw(data, title) {
  if (!Array.isArray(data) || data.length < 2) {
    chart.clear();
    chart.setOption({ title: { text: '沒有資料', left: 'center', top: 'middle' } });
    return;
  }
  const header = data[0];
  const rows   = data.slice(1);

  chart.setOption({
    title: { text: title || '', left: 'center' },
    tooltip: { trigger: 'axis' },
    grid: { left: 60, right: 30, top: 56, bottom: 90 },
    xAxis: {
      type: 'category',
      data: rows.map(r => r[0]?.text ?? ''),
      axisLabel: {
        interval: 0, rotate: 30,
        // 標籤太長就截斷，避免擠成一團
        formatter: v => (v && v.length > 10 ? v.slice(0, 10) + '…' : v)
      }
    },
    yAxis: { type: 'value', name: header[1]?.text ?? '' },
    series: [{ type: 'bar', data: rows.map(r => Number(r[1]?.value) || 0) }]
  }, true);
}

// 關鍵修正：加上 dataRange，Lark 才認得這份設定
const currentCondition = () => ({
  tableId: tableSel.value,
  dataRange: { type: SourceType.ALL },
  groups: [{ fieldId: groupSel.value }],
  series: 'COUNTA'
});

async function preview() {
  if (!tableSel.value || !groupSel.value) return;
  try {
    draw(await dashboard.getPreviewData(currentCondition()), '預覽');
  } catch (e) { say('預覽失敗：' + e.message); }
}

async function loadGroupFields() {
  groupSel.innerHTML = '';
  saveBtn.disabled = true;
  try {
    const cats = await dashboard.getCategories(tableSel.value);
    for (const c of cats) groupSel.add(new Option(c.fieldName, c.fieldId));
    saveBtn.disabled = cats.length === 0;
    await preview();
  } catch (e) { say('讀不到欄位：' + e.message); }
}

async function setupConfigUI() {
  panel.classList.add('show');
  try {
    const tables = await bitable.base.getTableMetaList();
    for (const t of tables) tableSel.add(new Option(t.name, t.id));

    const saved = await dashboard.getConfig().catch(() => null);
    const cond  = saved?.dataConditions?.[0];
    if (cond?.tableId && [...tableSel.options].some(o => o.value === cond.tableId)) {
      tableSel.value = cond.tableId;
    }
    await loadGroupFields();
    if (cond?.groups?.[0]?.fieldId &&
        [...groupSel.options].some(o => o.value === cond.groups[0].fieldId)) {
      groupSel.value = cond.groups[0].fieldId;
      await preview();
    }
  } catch (e) { say('初始化失敗：' + e.message); }
}

tableSel.onchange = loadGroupFields;
groupSel.onchange = preview;

saveBtn.onclick = async () => {
  saveBtn.disabled = true;
  try {
    await dashboard.saveConfig({ dataConditions: [currentCondition()] });
  } catch (e) {
    say('存檔失敗：' + e.message);
    saveBtn.disabled = false;
  }
};

async function showSavedChart() {
  panel.classList.remove('show');
  try {
    draw(await dashboard.getData());
  } catch (e) { say('取資料失敗：' + e.message); }
  dashboard.setRendered().catch(() => {});
}

if (dashboard.state === DashboardState.Create ||
    dashboard.state === DashboardState.Config) {
  setupConfigUI();
} else {
  showSavedChart();
}

dashboard.onDataChange(({ data }) => draw(data));
dashboard.onConfigChange(() => showSavedChart());
</script>

</body>
</html>
